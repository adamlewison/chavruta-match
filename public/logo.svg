<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5E6CB"/>
      <stop offset="100%" stop-color="#EAD4A8"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EAD4A8"/>
      <stop offset="100%" stop-color="#F5E6CB"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B5A23"/>
      <stop offset="100%" stop-color="#6B3610"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#6B3610" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- LEFT BOOK -->
  <!-- Cover -->
  <rect x="5" y="16" width="16" height="68" rx="2.5" fill="url(#coverGrad)" filter="url(#shadow)"/>
  <!-- Cover highlight -->
  <rect x="6" y="17" width="3" height="66" rx="1" fill="white" opacity="0.1"/>
  <!-- Pages (parallelogram: top-left, top-right, bottom-right, bottom-left) -->
  <path d="M21 18 L44 21 L44 79 L21 82 Z" fill="url(#pageL)" filter="url(#shadow)"/>
  <!-- Page edge lines -->
  <line x1="21" y1="20" x2="21" y2="80" stroke="#C8905A" stroke-width="0.6" opacity="0.4"/>
  <!-- Text lines on page -->
  <line x1="26" y1="31" x2="41" y2="32" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="26" y1="41" x2="41" y2="42" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="26" y1="51" x2="41" y2="52" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="26" y1="61" x2="41" y2="62" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="26" y1="71" x2="38" y2="72" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>

  <!-- RIGHT BOOK -->
  <!-- Pages (mirror) -->
  <path d="M56 21 L79 18 L79 82 L56 79 Z" fill="url(#pageR)" filter="url(#shadow)"/>
  <!-- Page edge lines -->
  <line x1="79" y1="20" x2="79" y2="80" stroke="#C8905A" stroke-width="0.6" opacity="0.4"/>
  <!-- Text lines on page -->
  <line x1="59" y1="32" x2="74" y2="31" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="59" y1="42" x2="74" y2="41" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="59" y1="52" x2="74" y2="51" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="59" y1="62" x2="74" y2="61" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <line x1="62" y1="72" x2="74" y2="71" stroke="#A06830" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
  <!-- Cover -->
  <rect x="79" y="16" width="16" height="68" rx="2.5" fill="url(#coverGrad)" filter="url(#shadow)"/>
  <!-- Cover highlight -->
  <rect x="91" y="17" width="3" height="66" rx="1" fill="white" opacity="0.1"/>

  <!-- CENTER CONNECTION -->
  <!-- Spine gap with two thin lines suggesting a shared center -->
  <line x1="50" y1="23" x2="50" y2="77" stroke="#C8905A" stroke-width="0.8" opacity="0.25" stroke-dasharray="2 3"/>
  <!-- Central linking dot -->
  <circle cx="50" cy="50" r="5.5" fill="#C47B2E"/>
  <circle cx="50" cy="50" r="3" fill="white" opacity="0.35"/>
  <circle cx="50" cy="50" r="1.5" fill="#C47B2E"/>
</svg>
