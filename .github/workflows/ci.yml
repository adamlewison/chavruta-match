name: CI

on:
  pull_request:
  push:
    branches: [main]

# One run per branch at a time. A new push to a PR cancels the outdated run, but
# runs on main are never cancelled — every commit that lands gets its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` (not `npm install`) — installs exactly what package-lock.json
      # pins, so CI tests the same dependency tree every time.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Architecture check
        run: npm run architecture:check

      - name: Test-suite guard
        run: npm run test:check
